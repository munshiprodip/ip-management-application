openapi: 3.1.0
info:
  title: KYAMCH Smart IPAM Enterprise REST API
  description: >
    Production REST API v1 for Khwaja Yunus Ali Medical College & Hospital (KYAMCH) Smart Network & IP Address Management.
    Provides authoritative IP allocation, CIDR hierarchy inspection, device inventory querying, read-only discovery evidence ingestion, and operational alerting.
  version: 1.0.0
  contact:
    name: KYAMCH Network Operations & IT Architecture Board
    email: netops@kyamch.local

servers:
  - url: http://127.0.0.1:8080/api/v1
    description: Local Development & Staging Gateway
  - url: https://ipam.kyamch.internal/api/v1
    description: Production Internal High-Availability Gateway

security:
  - BearerAuth: []

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: kyamch_token
      description: >
        Scoped API token generated by network administrators. Plain tokens start with prefix 'kyamch_'
        and are hashed via SHA-256 for secure database persistence.

  schemas:
    StandardMeta:
      type: object
      properties:
        version:
          type: string
          example: "v1"
        count:
          type: integer
          example: 25

    StandardError:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
              example: "FORBIDDEN_SCOPE"
            message:
              type: string
              example: "Insufficient permissions: Token lacks required scope."

    Vrf:
      type: object
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: "Default Global Routing"
        code:
          type: string
          example: "VRF-GLOBAL"
        rd:
          type: string
          example: "65000:1"
        is_default:
          type: boolean
          example: true
        subnets_count:
          type: integer
          example: 12

    Subnet:
      type: object
      properties:
        id:
          type: integer
          example: 4
        cidr:
          type: string
          example: "10.10.10.0/24"
        name:
          type: string
          example: "ICU Medical Monitoring"
        ip_version:
          type: integer
          example: 4
        total_addresses:
          type: integer
          example: 256
        allocated_addresses:
          type: integer
          example: 42
        utilization_percent:
          type: number
          format: float
          example: 16.4

    IpAllocationRequest:
      type: object
      required:
        - subnet_id
      properties:
        subnet_id:
          type: integer
          example: 4
        ip_address:
          type: string
          description: "Optional specific candidate IP. If omitted, earliest available IP is allocated."
          example: "10.10.10.55"
        classification:
          type: string
          enum: [static_host, dhcp_reservation, gateway, vip, loopback]
          default: static_host
        fqdn:
          type: string
          example: "icu-mon-01.kyamch.local"
        notes:
          type: string
          example: "Assigned to patient monitor station 3"
        idempotency_key:
          type: string
          description: "Unique token to ensure replay protection"
          example: "alloc_78129487192"

paths:
  /vrfs:
    get:
      summary: List all configured VRF routing contexts
      description: Returns active VRFs with child subnet metrics.
      tags: [VRFs]
      responses:
        '200':
          description: List of VRFs retrieved successfully.
        '401':
          description: Unauthenticated or invalid token.

  /subnets:
    get:
      summary: List subnets with optional filters
      tags: [Subnets]
      parameters:
        - name: vrf_id
          in: query
          schema:
            type: integer
        - name: site_id
          in: query
          schema:
            type: integer
        - name: parent_id
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Paginated subnets list.

  /subnets/{id}/capacity:
    get:
      summary: Get subnet utilization and capacity metrics
      tags: [Subnets]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Capacity statistics including exhaustion warning flags.

  /subnets/{id}/candidate-ips:
    get:
      summary: Explore virtual candidate allocation window
      tags: [Subnets]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: limit
          in: query
          schema:
            type: integer
            default: 10
      responses:
        '200':
          description: List of earliest contiguous candidate IPs.

  /ip-addresses:
    get:
      summary: Query authoritative IP address allocations
      tags: [IP Addresses]
      parameters:
        - name: address
          in: query
          schema:
            type: string
        - name: vrf_id
          in: query
          schema:
            type: integer
        - name: allocation_status
          in: query
          schema:
            type: string
            enum: [unassigned, assigned, reserved, quarantined, blocked]
      responses:
        '200':
          description: Paginated IP address records.

  /ip-allocations:
    post:
      summary: Atomically allocate an IP address
      tags: [Allocations]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IpAllocationRequest'
      responses:
        '201':
          description: IP successfully allocated with transaction lock.
        '422':
          description: Allocation conflict, pool exhausted, or invalid parameters.

  /ip-allocations/{id}/release:
    post:
      summary: Release an IP allocation into quarantine hold
      tags: [Allocations]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
                  example: "Decommissioned server"
      responses:
        '200':
          description: IP released and quarantined (T-012).

  /devices:
    get:
      summary: Query hardware device inventory
      tags: [Devices]
      responses:
        '200':
          description: Paginated device catalog.

  /discovery/observations:
    post:
      summary: Ingest batch evidence from authorized discovery agent
      tags: [Discovery]
      description: >
        Evidence-only submission (T-018). Updates connectivity observations;
        strictly forbidden from overwriting authoritative allocations.
      responses:
        '201':
          description: Observation batch ingested.

  /alerts:
    get:
      summary: List operational alerts with deduplication metrics
      tags: [Alerts]
      responses:
        '200':
          description: Paginated alerts list.
